services:
  - type: web
    name: ridecast-ml-homework-1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m backend.train_model
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
